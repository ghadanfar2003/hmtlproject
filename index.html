<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>protofolio</title>
  </head>
  <body>
    <div style="display: flex; justify-content: center">
      <form action="#" method="post" style="width: 50%">
        <fieldset>
          <legend>info person</legend>
          <label for="fname">First name:</label><br />
          <input type="text" id="fname" name="fname" /><br />
          <label for="lname">Last name:</label><br />
          <input type="text" id="lname" name="lname" />
        </fieldset>
        <fieldset>
          <legend>gender</legend>
          <input type="radio" id="m" name="fav_language" value="male" /><b>
            male </b
          ><br />

          <input type="radio" id="f" name="fav_language" value="female" /><b
            >famel</b
          >
        </fieldset>
        <div style="display: flex; justify-content: center; width: 618px">
          <fieldset>
            <label for="cites">Choose a city:</label>
            <select id="cites" name="cites">
              <option value="volvo">hama</option>
              <option value="saab">homs</option>
              <option value="fiat">aleepo</option>
              <option value="audi">dammascuse</option>
            </select>
          </fieldset>
        </div>
        <div style="display: flex; justify-content: center; width: 618px">
          <textarea name="textarea" id=""></textarea><br />
        </div>
        <div style="display: flex; justify-content: center">
          <input
            type="submit"
            value="send"
            style="width: 200px; height: 50px; background-color: blanchedalmond"
          />
          <input
            type="reset"
            value="Reset"
            style="width: 200px; height: 50px ; background-color:brown; color:aliceblue;o display:flexbox"
          />
        </div>
      </form>
    </div>
  </body>
</html>
